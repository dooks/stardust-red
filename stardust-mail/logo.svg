<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Stardust Mail logo">
  <style>
    .ink{fill:none;stroke:#000;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .dot{fill:#000}
    @media (prefers-color-scheme:dark){.ink{stroke:#fff}.dot{fill:#fff}}
  </style>
  <defs>
    <!-- cut a gap around the star so it reads where it overlaps the envelope -->
    <mask id="gap">
      <rect width="120" height="120" fill="#fff"/>
      <path d="M90 6 C92 24 96 28 114 30 C96 32 92 36 90 54 C88 36 84 32 66 30 C84 28 88 24 90 6 Z"
            fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <rect class="ink" x="10" y="38" width="86" height="62" rx="8"/>
    <path class="ink" d="M14 44 L53 74 L92 44"/>
  </g>
  <path class="dot" d="M90 6 C92 24 96 28 114 30 C96 32 92 36 90 54 C88 36 84 32 66 30 C84 28 88 24 90 6 Z"/>
  <circle class="dot" cx="62" cy="12" r="3.5"/>
  <circle class="dot" cx="112" cy="58" r="3"/>
</svg>
