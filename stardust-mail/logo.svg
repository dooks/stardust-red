<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="stardust-mail logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1430"/>
      <stop offset="1" stop-color="#120b18"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- envelope -->
  <rect x="20" y="42" width="72" height="50" rx="7" fill="#f4eee8"/>
  <path d="M22 46 L56 72 L90 46" fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- four-point star with a dark halo so it reads on top of the envelope -->
  <path d="M86 14 C88 30 92 34 108 36 C92 38 88 42 86 58 C84 42 80 38 64 36 C80 34 84 30 86 14 Z"
        fill="url(#star)" stroke="#1a0f20" stroke-width="5" paint-order="stroke" stroke-linejoin="round"/>
  <!-- stardust -->
  <circle cx="64" cy="20" r="3" fill="#ffe08a"/>
  <circle cx="104" cy="62" r="2.5" fill="#ffb27a"/>
  <circle cx="30" cy="28" r="2" fill="#ffe08a" opacity=".8"/>
</svg>
